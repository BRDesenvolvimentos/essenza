<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essenza - Controlo de Stock</title>
    <!-- Tailwind CSS para o design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
            <h1 class="text-3xl font-bold text-indigo-600">📦 Essenza - Controlo de Stock</h1>
            <span id="status-db" class="text-green-600 font-semibold text-sm">✅ Supabase Conectado</span>
        </div>

        <!-- Formulário para Adicionar Novo Produto -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Adicionar Novo Produto</h2>
            <form id="formProduto" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Código</label>
                    <input type="text" id="codigo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Nome do Produto</label>
                    <input type="text" id="nome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Categoria</label>
                    <select id="categoria" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="Revenda">Revenda</option>
                        <option value="Consumo">Consumo</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Stock Inicial</label>
                    <input type="number" id="estoque_inicial" min="0" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="md:col-span-5 flex justify-end">
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded shadow hover:bg-indigo-700 transition">Registar Produto</button>
                </div>
            </form>
        </div>

        <!-- Tabela do Painel de Stock -->
        <div class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Painel de Stock Atual</h2>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Código</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Produto</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoria</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Stock Inicial</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Atual</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-estoque" class="bg-white divide-y divide-gray-200">
                    <!-- As linhas vão aparecer aqui magicamente através do JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // === AS SUAS CHAVES DO SUPABASE ===
        const supabaseUrl = 'https://midlkoozyzhngzzvjisc.supabase.co';
        const supabaseKey = 'sb_publishable_pnAQ_uv8V_3IZ5nr2Klyxw_gFE0f-Vt';
        const clienteSupabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Função para carregar os dados da Base de Dados e preencher a tabela
        async function carregarEstoque() {
            const { data, error } = await clienteSupabase
                .from('vw_painel_estoque')
                .select('*')
                .order('nome', { ascending: true });

            if (error) {
                console.error('Erro ao procurar stock:', error);
                return;
            }

            const tbody = document.getElementById('tabela-estoque');
            tbody.innerHTML = ''; // Limpa a tabela antes de carregar

            data.forEach(item => {
                // A mesma lógica de cores que usávamos no Excel!
                let corStatus = 'bg-green-100 text-green-800'; // OK (Verde)
                if (item.status === 'Repor') corStatus = 'bg-yellow-100 text-yellow-800'; // Amarelo
                if (item.status === 'Esgotado') corStatus = 'bg-red-100 text-red-800'; // Vermelho

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.codigo}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.nome}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.categoria}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-center text-gray-500">${item.estoque_inicial}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-center font-bold text-gray-900">${item.estoque_atual}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${corStatus}">
                            ${item.status}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 2. Função para guardar um novo produto quando se clica no botão
        document.getElementById('formProduto').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita que a página pisque
            
            const codigo = document.getElementById('codigo').value;
            const nome = document.getElementById('nome').value;
            const categoria = document.getElementById('categoria').value;
            const estoque_inicial = document.getElementById('estoque_inicial').value;

            // Envia para o Supabase
            const { data, error } = await clienteSupabase
                .from('produtos')
                .insert([
                    { codigo: codigo, nome: nome, categoria: categoria, estoque_inicial: parseInt(estoque_inicial) }
                ]);

            if (error) {
                alert('Erro ao guardar: ' + error.message);
            } else {
                document.getElementById('formProduto').reset(); // Limpa as caixas de texto
                carregarEstoque(); // Atualiza a tabela na hora!
            }
        });

        // Quando o site abre, ele puxa automaticamente a tabela
        carregarEstoque();
    </script>
</body>
</html>
